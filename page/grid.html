<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo Grid</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            grid-template-columns: 25% 25% 25% 25%;
            grid-template-rows: 20% auto 10%;
            grid-template-areas: 
            "nav header header header"
            "nav main main main"
            "footer footer footer footer";
        }
        header{
            grid-area: header;
            background-color: aquamarine;
        }
        nav{
            grid-area: nav;
            background-color: navajowhite;
        }
        main{
            grid-area: main;
            background-color: mediumpurple;
        }
        footer{
            grid-area: footer;
            background-color: forestgreen;
        }
    </style>
</head>
<body>
    <header>
        Contenido de header
    </header>
    <nav>
        Contenido de nav
    </nav>
    <main>
        Contenido de main
    </main>
    <footer>
        Contenido de footer
    </footer>
</body>
</html
